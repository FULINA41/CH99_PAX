[project]
name = "chp99-workflows"
version = "0.1.0"
description = "Hatchet workflows for the Chapter 99 take-home"
requires-python = ">=3.11"
dependencies = [
    "hatchet-sdk>=1.37.0,<2",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pycountry>=24.6",
    "pypdf>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
