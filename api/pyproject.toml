[project]
name = "chp99-api"
version = "0.1.0"
description = "Read-only JSON API over the parsed Chapter 99 database"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pycountry>=24.6",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
